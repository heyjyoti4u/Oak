<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Destination Details</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Brygada+1918:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="fonts/icomoon/style.css">
    <link rel="stylesheet" href="fonts/flaticon/font/flaticon.css">
    <link rel="stylesheet" href="css/tiny-slider.css">
    <link rel="stylesheet" href="css/aos.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/bootstrap.min.css"> <style>
        /* Custom Styles for Dynamic Elements */
        
        /* 1. Hero Image Dynamic Background */
        .dynamic-hero {
            height: 60vh;
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
        }
        .hero-overlay {
            background: rgba(0,0,0,0.4);
            position: absolute; top:0; left:0; right:0; bottom:0;
        }
        .hero-content { z-index: 2; }

        /* 2. Events Horizontal Scroller (Netflix Style) */
        .scrolling-wrapper {
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 20px;
        }
        .scrolling-wrapper::-webkit-scrollbar { display: none; } /* Hide scrollbar */
        .event-card {
            flex: 0 0 auto;
            width: 250px;
            margin-right: 20px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .event-card img { width: 100%; height: 150px; object-fit: cover; }
        .event-info { padding: 15px; background: #fff; }

        /* 3. Popular Places Grid */
        .place-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <nav class="site-nav mt-3">
        <div class="container">
            <div class="site-navigation">
                <a href="index.html" class="logo m-0 float-start">Passport</a>
                <ul class="js-clone-nav d-none d-lg-inline-block text-center site-menu p-0 m-0 float-end">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="blog.html">Back to Blogs</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div id="hero-section" class="dynamic-hero">
        <div class="hero-overlay"></div>
        <div class="container hero-content" data-aos="fade-up">
            <h1 class="heading" id="dest-name">Loading...</h1>
            <p id="dest-tagline" class="mb-5" style="font-size: 1.2rem;">Please wait</p>
        </div>
    </div>

    <div class="section">
        <div class="container">
            <div class="row mb-4">
                <div class="col-12"><h2 class="heading">What's Happening</h2></div>
            </div>
            <div class="scrolling-wrapper" id="events-container">
                </div>
        </div>
    </div>

    <div class="section bg-light">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-12 text-center" data-aos="fade-up">
                    <h2 class="heading mb-4" id="story-heading">History</h2>
                    <p class="lead" id="story-content">Loading history...</p>
                </div>
            </div>
        </div>
    </div>

    <div class="section">
        <div class="container">
            <div class="row mb-5">
                <div class="col-12 text-center"><h2 class="heading">Popular Places to Visit</h2></div>
            </div>
            <div class="row" id="places-grid">
                </div>
        </div>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/aos.js"></script>
    <script src="js/custom.js"></script>
    
    <script src="js/data.js"></script>

    <script>
        // 1. Get the 'id' from the URL (e.g., view.html?id=goa)
        const params = new URLSearchParams(window.location.search);
        const destId = params.get('id');

        // 2. Find the data
        const data = travelData[destId];

        if (data) {
            // A. Update Hero Section
            document.getElementById('dest-name').innerText = "Explore " + data.name;
            document.getElementById('dest-tagline').innerText = data.tagline;
            document.getElementById('hero-section').style.backgroundImage = `url('${data.heroImage}')`;

            // B. Update Events Slider (Loop)
            const eventsContainer = document.getElementById('events-container');
            let eventsHtml = '';
            data.events.forEach(event => {
                eventsHtml += `
                    <div class="event-card">
                        <img src="${event.img}" alt="${event.title}">
                        <div class="event-info">
                            <h5>${event.title}</h5>
                            <span class="text-primary">${event.date}</span>
                        </div>
                    </div>
                `;
            });
            eventsContainer.innerHTML = eventsHtml;

            // C. Update Story Section
            document.getElementById('story-heading').innerText = data.story.heading;
            document.getElementById('story-content').innerText = data.story.content;

            // D. Update Popular Places Grid (Loop of 8)
            const placesContainer = document.getElementById('places-grid');
            let placesHtml = '';
            data.places.forEach(place => {
                placesHtml += `
                    <div class="col-6 col-md-3 mb-4 place-card" data-aos="fade-up">
                        <div class="media-entry">
                            <img src="${place.img}" alt="${place.name}" class="img-fluid mb-2">
                            <h5 class="text-center mt-2"><a href="#">${place.name}</a></h5>
                        </div>
                    </div>
                `;
            });
            placesContainer.innerHTML = placesHtml;

        } else {
            document.body.innerHTML = "<h1 class='text-center mt-5'>Destination Not Found. Check your URL.</h1>";
        }
    </script>

    <script>
        // Initialize AOS animation
        AOS.init();
    </script>
</body>
</html>
